name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -o pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Gate
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck && npm run lint && npm test && npm run build:ui

      - name: Production builds
        shell: bash
        run: |
          set -o pipefail
          npm run build && npm run build:server

      - name: Package zip and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -o pipefail
          # One top-level folder, so unzipping makes a single directory. Launchers sit beside dist/ and dist-server/.
          STAGE="inflow-$TAG"
          mkdir "$STAGE"
          cp -r dist dist-server LICENSE README.md "$STAGE/"
          cp -- launchers/* "$STAGE/"
          chmod +x "$STAGE"/*.command "$STAGE"/*.sh
          zip -r "inflow-$TAG.zip" "$STAGE" -x "$STAGE/.gitattributes"
          gh release create "$TAG" "inflow-$TAG.zip" --generate-notes --verify-tag

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/furbysoup/storm-chasers
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
